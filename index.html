<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>PulseBlocks</title>
    <meta name="theme-color" content="#080a10">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="PulseBlocks">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icon.svg" type="image/svg+xml">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="shell">
      <aside class="sidebar" aria-label="Navegacion principal">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 3c4.8 0 8.8 3.7 9 8.5.2 4.1-2.6 7.8-6.7 8.8-1.4.3-2.7-.7-2.7-2.1v-2.3H9.4c-3.5 0-6.4-2.8-6.4-6.4C3 5.9 5.9 3 9.5 3H12Z"/><path d="M8 10.5h8M8 14h5.5"/></svg>
          </span>
          <div>
            <strong>PulseBlocks</strong>
            <small>Productividad con bateria humana incluida.</small>
          </div>
        </div>
        <nav class="nav-tabs" id="tabs"></nav>
        <div class="sidebar-note">
          <span>Hoy</span>
          <strong id="sidebarDate"></strong>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">Wellness productivity dashboard</p>
            <h1 id="pageTitle">Hoy</h1>
          </div>
          <div class="topbar-actions">
            <button class="icon-button" id="quickSeed" type="button" title="Cargar datos de prueba" aria-label="Cargar datos de prueba">
              <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
            </button>
            <button class="ghost-button" id="exportPdfTop" type="button">PDF</button>
            <button class="ghost-button" id="exportTop" type="button">Exportar JSON</button>
          </div>
        </header>
        <section id="app" class="app-view" aria-live="polite"></section>
      </main>
    </div>

    <div id="toastRegion" class="toast-region" aria-live="assertive"></div>
    <script src="mockData.js"></script>
    <script src="app.js"></script>
    <script>
      if ("serviceWorker" in navigator && location.protocol !== "file:") {
        window.addEventListener("load", function () {
          navigator.serviceWorker.register("sw.js").catch(function () {});
        });
      }
    </script>
  </body>
</html>
